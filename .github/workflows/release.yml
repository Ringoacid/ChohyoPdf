# v1.2.3 のようなタグをプッシュすると、テストしてから NuGet に公開する。
# nuget.org の Trusted Publishing を使うので、API キーは保存しない。
# 必要な設定:
#   - nuget.org の Trusted Publishing のポリシー（Workflow File は release.yml）
#   - リポジトリのシークレット NUGET_USER（nuget.org のユーザー名。メールアドレスではない）
name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write   # Trusted Publishing で使う OIDC トークンの発行を許可する
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test
        run: dotnet test tests/ChohyoPdf.Tests -c Release

      # タグ名（v1.2.3）からバージョン（1.2.3）を取り出す
      - name: Version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Pack
        shell: bash
        run: dotnet pack src/ChohyoPdf -c Release -o artifacts -p:Version=$VERSION

      # 1 時間だけ有効な API キーを受け取る
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Windows ではワイルドカード（artifacts/*.nupkg）が展開されないので、ファイル名を指定する。
      # .snupkg（シンボル）は同じフォルダから自動でアップロードされる
      - name: NuGet push
        shell: bash
        run: dotnet nuget push "artifacts/ChohyoPdf.$VERSION.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
